<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brands Planets POS</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
:root {
      --blue: #0d2b4f;
      --blue-2: #143b6a;
      --orange: #f47b20;
      --orange-soft: #fff1e8;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #142033;
      --muted: #6d7788;
      --line: #e6ebf2;
      --danger: #d92d20;
      --success: #138a43;
      --shadow: 0 14px 36px rgba(13, 43, 79, 0.1);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% -8%, rgba(244,123,32,0.08), transparent 28%),
        linear-gradient(180deg, #fbfcff 0%, var(--bg) 42%, #eef3f9 100%);
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: 0; }
    img { max-width: 100%; }
    .hidden { display: none !important; }

    .login-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(18px, 4vw, 42px);
      background: #ffffff;
      position: relative;
      overflow-y: auto;
    }
    .login-card {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: min(430px, 100%);
      margin: auto;
    }
    .login-box {
      position: relative;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 22px 64px rgba(13, 43, 79, 0.12);
      padding: clamp(24px, 4vw, 40px);
      animation: loginRise .48s ease both;
      text-align: center;
    }
    .login-box::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(13, 43, 79, 0.08);
      border-radius: 22px;
      pointer-events: none;
    }
    .login-box-head {
      display: grid;
      gap: 8px;
      margin-bottom: 26px;
      justify-items: center;
    }
    .login-logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: var(--orange);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 18px 38px rgba(244,123,32,0.28);
    }
    .login-box-head strong {
      color: var(--blue);
      font-size: clamp(30px, 4vw, 40px);
      line-height: 1;
      letter-spacing: 0;
    }
    .login-box-head span {
      color: var(--muted);
      font-size: 16px;
      font-weight: 800;
    }
    .login-submit {
      width: 100%;
      min-height: 58px;
      margin-top: 10px;
      box-shadow: 0 14px 28px rgba(244, 123, 32, 0.2);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .login-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 42px rgba(244, 123, 32, 0.32);
    }
    @keyframes loginRise {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .muted { color: var(--muted); }
    .field { display: grid; gap: 7px; margin: 14px 0; }
    .login-box .field {
      text-align: left;
    }
    label { font-size: 13px; font-weight: 700; color: #29384d; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 72px; }
    .password-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 10px;
      min-height: 36px;
      padding: 0 10px;
      background: #eef3f9;
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
    }
    .login-box input {
      min-height: 56px;
      border-radius: 16px;
      font-size: 17px;
      background: #fbfdff;
    }
    .login-box .btn {
      min-height: 58px;
      border-radius: 15px;
      font-size: 17px;
      margin-top: 6px;
      box-shadow: 0 18px 36px rgba(244,123,32,0.2);
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 12px 13px;
      color: var(--text);
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(244,123,32,0.14);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      border-radius: 12px;
      padding: 10px 14px;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .btn:hover { transform: translateY(-1px); background: var(--blue-2); box-shadow: 0 12px 26px rgba(13,43,79,0.18); }
    .btn.orange { background: var(--orange); }
    .btn.light { background: #eef3f9; color: var(--blue); box-shadow: none; }
    .btn.danger { background: var(--danger); }
    .btn.ghost { background: transparent; color: var(--blue); border: 1px solid var(--line); box-shadow: none; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn.icon { width: 42px; padding: 0; }
    .alert {
      border-radius: 12px;
      padding: 11px 13px;
      margin-top: 12px;
      background: var(--orange-soft);
      color: #7b3908;
      font-weight: 700;
      font-size: 13px;
    }
    .attendance-user-card {
      display: grid;
      gap: 5px;
      margin: 12px 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f8fafc;
    }
    .attendance-user-card small {
      color: var(--muted);
      font-weight: 900;
      text-transform: uppercase;
      font-size: 11px;
    }
    .attendance-user-card strong {
      color: var(--blue);
      font-size: 24px;
    }
    .attendance-user-card span {
      color: var(--orange);
      font-weight: 800;
      font-size: 13px;
    }
    .attendance-report-head {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 12px;
      margin: 14px 0;
    }
    .attendance-report-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfdff;
      padding: 13px;
      box-shadow: 0 8px 20px rgba(13,43,79,0.06);
    }
    .attendance-report-card small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .attendance-report-card strong {
      display: block;
      margin-top: 6px;
      color: var(--blue);
      font-size: 22px;
    }
    .attendance-month-bar {
      display: flex;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
      margin: 14px 0;
    }
    .attendance-month-bar .field {
      margin: 0;
      max-width: 240px;
      flex: 1 1 190px;
    }
    .attendance-table table {
      min-width: 820px;
    }
    .staff-shell {
      display: grid;
      gap: 16px;
    }
    .staff-hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: stretch;
    }
    .staff-add-card {
      border-color: #dce7f3;
      background:
        radial-gradient(circle at 92% 8%, rgba(244,123,32,0.12), transparent 26%),
        linear-gradient(180deg, #fff, #fbfdff);
    }
    .staff-add-layout {
      display: grid;
      grid-template-columns: minmax(220px, 0.7fr) minmax(360px, 1.3fr);
      gap: 18px;
      align-items: start;
    }
    .staff-command {
      min-height: 100%;
      border: 1px solid rgba(13,43,79,0.1);
      border-radius: 18px;
      padding: 16px;
      background:
        linear-gradient(135deg, rgba(13,43,79,0.96), rgba(28,70,116,0.9)),
        var(--blue);
      color: #fff;
      box-shadow: 0 16px 34px rgba(13,43,79,0.16);
      display: grid;
      gap: 14px;
      align-content: start;
    }
    .staff-command-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .staff-command-icon {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--orange);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 14px 30px rgba(244,123,32,0.32);
    }
    .staff-command-title strong {
      display: block;
      font-size: 20px;
      line-height: 1.15;
    }
    .staff-command-title span {
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      font-weight: 800;
    }
    .staff-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .staff-stat {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfdff;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(13,43,79,0.06);
    }
    .staff-command .staff-stat {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.14);
      box-shadow: none;
    }
    .staff-stat small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .staff-stat strong {
      display: block;
      margin-top: 6px;
      color: var(--blue);
      font-size: 26px;
    }
    .staff-command .staff-stat small { color: rgba(255,255,255,0.66); }
    .staff-command .staff-stat strong { color: #fff; }
    .staff-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-items: end;
    }
    .staff-form .field,
    .staff-form input,
    .staff-form select {
      min-width: 0;
      width: 100%;
    }
    .staff-form .full { grid-column: 1 / -1; }
    .staff-submit {
      grid-column: 1 / -1;
      width: 100%;
      min-height: 58px;
      font-size: 18px;
      margin-top: 2px;
    }
    .staff-directory {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .staff-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, #fff, #fbfdff);
      padding: 14px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 12px;
    }
    .staff-card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .staff-avatar {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--orange);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 18px;
      box-shadow: 0 12px 24px rgba(244,123,32,0.22);
      flex: 0 0 auto;
    }
    .staff-meta { min-width: 0; }
    .staff-meta strong {
      display: block;
      color: var(--blue);
      font-size: 17px;
      overflow-wrap: anywhere;
    }
    .staff-meta span {
      display: block;
      color: var(--muted);
      margin-top: 3px;
      font-size: 13px;
      font-weight: 800;
    }
    .staff-detail {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .staff-detail div {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding-top: 7px;
    }
    .staff-detail strong {
      color: var(--blue);
      text-align: right;
      overflow-wrap: anywhere;
    }
    .staff-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 270px 1fr;
    }
    .sidebar {
      background: var(--blue);
      color: #fff;
      padding: 20px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .side-head {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      background:
        radial-gradient(circle at 16% 12%, rgba(244,123,32,0.24), transparent 34%),
        linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05)),
        rgba(255,255,255,0.04);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 18px 38px rgba(0,0,0,0.16);
      position: relative;
      overflow: hidden;
    }
    .side-head::after {
      content: "";
      position: absolute;
      right: 14px;
      top: 14px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 6px rgba(244,123,32,0.14);
    }
    .mini-mark {
      width: 62px;
      height: 62px;
      border-radius: 20px;
      background: var(--orange);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 0;
      color: #fff;
      box-shadow: 0 14px 28px rgba(244,123,32,0.34), inset 0 1px 0 rgba(255,255,255,0.24);
      flex: 0 0 auto;
    }
    .side-copy {
      min-width: 0;
      display: grid;
      gap: 5px;
    }
    .side-head strong {
      display: block;
      font-size: 20px;
      line-height: 1.06;
      letter-spacing: 0;
      color: #fff;
      max-width: 140px;
    }
    .side-head span {
      display: block;
      color: rgba(255,255,255,0.76);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .nav { display: grid; gap: 7px; padding-top: 18px; }
    .nav button {
      width: 100%;
      justify-content: flex-start;
      background: transparent;
      color: rgba(255,255,255,0.82);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      font-weight: 800;
      text-align: left;
    }
    .nav button.active, .nav button:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .main { min-width: 0; }
    .topbar {
      min-height: 72px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      box-shadow: 0 8px 24px rgba(13,43,79,0.05);
    }
    .topbar h2 { margin: 0; color: var(--blue); font-size: 20px; }
    .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .sync-btn {
      min-height: 42px;
      color: var(--blue);
      font-weight: 900;
      padding-inline: 13px;
    }
    .sync-btn::before {
      content: "";
      width: 14px;
      height: 14px;
      border: 2px solid var(--blue);
      border-right-color: transparent;
      border-radius: 50%;
      display: inline-block;
    }
    .sync-btn:hover::before {
      transform: rotate(180deg);
      transition: transform .28s ease;
    }
    .notify-icon {
      position: relative;
      overflow: visible;
    }
    .notify-icon span {
      position: relative;
      width: 16px;
      height: 18px;
      display: block;
      border: 2px solid var(--blue);
      border-bottom: 0;
      border-radius: 10px 10px 6px 6px;
    }
    .notify-icon span::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
      transform: translateX(-50%);
    }
    .notify-icon span::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
      transform: translateX(-50%);
    }
    .notify-icon::after {
      content: "";
      position: absolute;
      right: 7px;
      top: 7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
      border: 2px solid #eef3f9;
    }
    .role-pill, .status-pill {
      border-radius: 999px;
      background: var(--orange-soft);
      color: #8a410d;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 900;
    }
    .status-pill { background: #edf6ff; color: var(--blue); }
    .content {
      width: min(1720px, 100%);
      margin: 0 auto;
      padding: 22px;
    }
    .section { display: none; animation: fade .22s ease; }
    .section.active { display: block; }
    @keyframes fade { from { opacity: .35; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .grid { display: grid; gap: 16px; }
    .stats { grid-template-columns: repeat(5, minmax(150px, 1fr)); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .card:hover {
      border-color: #d9e3ef;
      box-shadow: 0 18px 46px rgba(13,43,79,0.11);
    }
    .stat small { color: var(--muted); font-weight: 800; }
    .stat strong { display: block; margin-top: 9px; color: var(--blue); font-size: 26px; }
    .stat em { display: block; color: var(--orange); font-style: normal; font-size: 12px; margin-top: 5px; font-weight: 900; }
    .two-col { grid-template-columns: 1.3fr .7fr; align-items: start; }
    .chart-card {
      padding: 0;
      overflow: hidden;
    }
    .chart-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
    }
    .chart-head h3 {
      margin: 0;
      color: var(--blue);
      font-size: 22px;
    }
    .chart-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .chart-live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      background: #e9f7ef;
      color: var(--success);
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 900;
      flex: 0 0 auto;
    }
    .chart-live::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(19,138,67,0.12);
    }
    .chart-kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 14px 18px 0;
    }
    .chart-kpi {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
      padding: 13px;
      min-width: 0;
      box-shadow: 0 8px 20px rgba(13,43,79,0.06);
    }
    .chart-kpi small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .chart-kpi strong {
      display: block;
      margin-top: 5px;
      color: var(--blue);
      font-size: 18px;
      overflow-wrap: anywhere;
    }
    .chart-wrap {
      height: clamp(260px, 34vw, 390px);
      margin: 16px 18px 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background:
        linear-gradient(#fff, #fff) padding-box,
        linear-gradient(135deg, rgba(13,43,79,0.08), rgba(244,123,32,0.18)) border-box;
      position: relative;
    }
    .chart-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }
    .chart-tooltip {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, calc(-100% - 16px));
      background: var(--blue);
      color: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 18px 36px rgba(13,43,79,0.22);
      opacity: 0;
      transition: opacity .12s ease, transform .12s ease;
      z-index: 3;
      min-width: 148px;
    }
    .chart-tooltip.visible { opacity: 1; }
    .chart-tooltip::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 14px;
      height: 14px;
      background: var(--blue);
      border-right: 1px solid rgba(255,255,255,0.16);
      border-bottom: 1px solid rgba(255,255,255,0.16);
      transform: translateX(-50%) rotate(45deg);
    }
    .chart-tooltip strong {
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
    }
    .chart-tooltip span {
      display: block;
      font-size: 14px;
      font-weight: 800;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .section-title h3 { margin: 0; color: var(--blue); }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;

    /* Modern performance theme */
    :root {
      --blue: #08284c;
      --blue-2: #123c69;
      --orange: #ff7a1a;
      --orange-soft: #fff3ea;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #101b2d;
      --muted: #697588;
      --line: #dfe7f1;
      --shadow: 0 14px 34px rgba(8, 40, 76, 0.08);
      --shadow-hover: 0 18px 46px rgba(8, 40, 76, 0.13);
      --radius: 18px;
    }
    html {
      scroll-behavior: smooth;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background:
        radial-gradient(circle at 12% -10%, rgba(255,122,26,0.12), transparent 28%),
        radial-gradient(circle at 100% 0%, rgba(8,40,76,0.08), transparent 26%),
        linear-gradient(180deg, #fbfdff 0%, #f4f7fb 48%, #edf2f8 100%);
    }
    ::selection { background: rgba(255,122,26,0.22); color: var(--blue); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #eef3f9; }
    ::-webkit-scrollbar-thumb {
      background: #b7c3d3;
      border: 3px solid #eef3f9;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover { background: #8fa0b5; }
    .sidebar {
      background:
        radial-gradient(circle at 0% 0%, rgba(255,122,26,0.18), transparent 26%),
        linear-gradient(180deg, #08284c 0%, #0b315b 54%, #092747 100%);
      box-shadow: 10px 0 34px rgba(8,40,76,0.12);
    }
    .nav button {
      min-height: 46px;
      border: 1px solid transparent;
      transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
    }
    .nav button.active {
      background: rgba(255,255,255,0.16);
      border-color: rgba(255,255,255,0.12);
      box-shadow: inset 3px 0 0 var(--orange);
    }
    .nav button:hover {
      background: rgba(255,255,255,0.11);
      transform: translateX(3px);
    }
    .topbar {
      min-height: 76px;
      background: rgba(255,255,255,0.86);
      border-bottom-color: rgba(223,231,241,0.92);
      box-shadow: 0 12px 30px rgba(8,40,76,0.06);
    }
    .topbar h2 {
      font-size: 22px;
      letter-spacing: 0;
    }
    .content {
      padding: clamp(16px, 2vw, 28px);
    }
    .section {
      animation: fadeSlideUp .28s cubic-bezier(.22,1,.36,1) both;

<body>
  <div id="loginPage" class="login-shell">
    <section class="login-card" aria-label="Login panel">
      <div class="login-box">
        <div class="login-logo">BP</div>

        <form id="loginForm">
          <div class="field">

          </div>
          <div class="field">

            <div class="password-wrap">
              <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
              <button class="password-toggle" id="passwordToggle" type="button">Show</button>
            </div>

  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="side-head">
        <div class="mini-mark">BP</div>

    </aside>
    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="btn light icon mobile-menu" id="menuBtn">Menu</button>
          <div>
            <h2>POS-SYSTEM</h2>
            <span class="muted" id="liveClock"></span>
          </div>
        </div>
        <div class="top-actions">
          <span class="role-pill" id="signedIn"></span>
          <button class="btn light sync-btn" id="syncBtn" title="Sync and refresh system">Sync</button>
          <button class="btn light icon notify-icon" id="notifyBtn" title="Notifications" aria-label="Notifications"><span></span></button>
          <button class="btn ghost" id="logoutBtn">Logout</button>
        </div>
      </header>
      <div id="notificationPanel" class="notification-panel card hidden"></div>
      <div class="content">
        <section id="dashboard" class="section active"></section>
        <section id="inventory" class="section"></section>
        <section id="billing" class="section"></section>
        <section id="reports" class="section"></section>
        <section id="attendance" class="section"></section>
        <section id="dayclose" class="section"></section>
        <section id="expenses" class="section"></section>
        <section id="staff" class="section"></section>
        <section id="users" class="section"></section>
        <section id="settings" class="section"></section>
      </div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="printArea" class="hidden"></div>
  <script>
const money = n => "Rs " + Number(n || 0).toLocaleString("en-PK", { maximumFractionDigits: 0 });
    const todayKey = () => new Date().toISOString().slice(0, 10);
    const monthKey = () => new Date().toISOString().slice(0, 7);
    const yesterdayKey = () => {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toISOString().slice(0, 10);
    };
    const uid = prefix => prefix + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
    const API_BASE_URL = window.location.origin;
    const API_STATE_URL = `${API_BASE_URL}/api/state`;

    const seed = {
      users: [
        { id: "u-owner", username: "Admin", password: "admin&8687", role: "Owner", active: true },
        { id: "u-cashier", username: "cashier", password: "1234", role: "Cashier", active: true, permissions: ["dashboard", "billing", "reports", "attendance"] }
      ],
      products: [
        { id: uid("p"), name: "Premium Shirt", barcode: "1001", category: "MEN'S", price: 2200, stock: 18, discount: 5, remarks: "New arrival", image: "" },
        { id: uid("p"), name: "Classic Jeans", barcode: "1002", category: "MEN'S", price: 3500, stock: 9, discount: 0, remarks: "", image: "" },
        { id: uid("p"), name: "Leather Wallet", barcode: "1003", category: "MEN'S", price: 1800, stock: 5, discount: 10, remarks: "Low stock watch", image: "" },
        { id: uid("p"), name: "Sports Shoes", barcode: "1004", category: "KID'S", price: 6200, stock: 14, discount: 3, remarks: "", image: "" },
        { id: uid("p"), name: "Perfume Gift Set", barcode: "1005", category: "WOMEN", price: 4100, stock: 4, discount: 0, remarks: "Restock soon", image: "" }
      ],
      bills: [],
      expenses: [],
      staff: [
        { id: "s-cashier", name: "cashier", role: "Cashier", phone: "", remarks: "Default staff" }
      ],
      attendance: [],
      stockHistory: [],
      dayClosings: [],
      settings: {
        shopName: "Brands Planets",
        phone: "03000000000",
        address: "",
        email: "",
        receiptFooter: "Thank you for shopping with us",
        receiptFooterAlign: "center",
        receiptFooterDivider: true,
        receiptFooterEnabled: true,
        autoPrint: false,
        logo: "",
        cloudMode: false
      }
    };

    let state = JSON.parse(localStorage.getItem("bp-pos-state") || "null") || seed;
    let currentUser = JSON.parse(sessionStorage.getItem("bp-pos-session") || "null");
    let activeSection = sessionStorage.getItem("bp-pos-active-section") || "dashboard";
    let cart = [];
    let billDiscount = 0;
    let chart;
    let editingProductId = null;
    let lastNotice = "";
    let cloudSaveTimer = null;
    let cloudOnline = false;
    const inventoryCategories = ["MEN'S", "KID'S", "WOMEN"];

    const defaultCashierPermissions = ["dashboard", "billing", "reports", "attendance", "expenses"];
    const permissionLabels = {
      dashboard: "Dashboard",
      billing: "Billing",
      reports: "Reports",
      attendance: "Attendance",
      expenses: "Expenses",
      staff: "Staff",
      inventory: "Inventory",
      dayclose: "Day Close"
    };
    const navItems = [
      ["dashboard", "Dashboard"],
      ["inventory", "Inventory"],
      ["billing", "Billing"],
      ["reports", "Reports"],
      ["attendance", "Attendance"],
      ["dayclose", "Day Close"],
      ["expenses", "Expenses"],
      ["staff", "Staff"],
      ["users", "Manage Users"],
      ["settings", "Settings"]
    ];

    function save() {
      localStorage.setItem("bp-pos-state", JSON.stringify(state));
      window.dispatchEvent(new Event("storage-lite"));
      queueCloudSave();
    }
    function mergeState(remoteState) {
      if (!remoteState || !Array.isArray(remoteState.users) || !Array.isArray(remoteState.products)) return false;
      state = {
        ...seed,
        ...remoteState,
        settings: { ...seed.settings, ...(remoteState.settings || {}) }
      };
      localStorage.setItem("bp-pos-state", JSON.stringify(state));
      return true;
    }
    async function fetchWithTimeout(url, options = {}, timeout = 4500) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }
    async function pullCloudState(showMessage = false) {
      try {
        const response = await fetchWithTimeout(API_STATE_URL, { method: "GET", headers: { Accept: "application/json" } });
        if (!response.ok) throw new Error(`Cloud responded ${response.status}`);
        const payload = await response.json();
        const remoteState = payload.state || payload;
        if (!mergeState(remoteState)) throw new Error("Cloud state format is invalid");
        cloudOnline = true;
        if (showMessage) toast("Cloud data loaded from Hostinger.");
        return true;
      } catch (error) {
        cloudOnline = false;
        if (showMessage) toast("Cloud sync unavailable. Using local offline data.");
        return false;
      }
    }
    async function pushCloudState() {
      try {
        const response = await fetchWithTimeout(API_STATE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ state, updatedAt: new Date().toISOString() })
        });
        if (!response.ok) throw new Error(`Cloud responded ${response.status}`);
        cloudOnline = true;
        return true;
      } catch (error) {
        cloudOnline = false;
        return false;
      }
    }
    function queueCloudSave() {
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(() => pushCloudState(), 700);
    }
    function normalizeSettings() {
      state.settings = { ...seed.settings, ...(state.settings || {}) };
      if (state.settings.address === undefined) state.settings.address = "";
      if (state.settings.email === undefined) state.settings.email = "";
      if (state.settings.receiptFooterAlign === undefined) state.settings.receiptFooterAlign = "center";
      if (state.settings.receiptFooterDivider === undefined) state.settings.receiptFooterDivider = true;
      if (state.settings.receiptFooterEnabled === undefined) state.settings.receiptFooterEnabled = true;
    }
    function normalizeInventoryCategories() {
      const replacements = {
        Fashion: "MEN'S",
        Beauty: "WOMEN",
        Accessories: "MEN'S",
        Footwear: "KID'S"
      };
      let changed = false;
      state.products.forEach(product => {
        if (replacements[product.category]) {
          product.category = replacements[product.category];
          changed = true;
        }
      });
      if (changed) localStorage.setItem("bp-pos-state", JSON.stringify(state));
    }
    function normalizeUserPermissions() {
      let changed = false;
      const owner = state.users.find(user => user.role === "Owner" || user.id === "u-owner");
      if (owner && (owner.username !== "Admin" || owner.password !== "admin&8687")) {
        owner.username = "Admin";
        owner.password = "admin&8687";
        owner.role = "Owner";
        owner.active = true;
        changed = true;
      }
      state.users.forEach(user => {
        if (user.role === "Cashier" && !Array.isArray(user.permissions)) {
          user.permissions = [...defaultCashierPermissions];
          changed = true;
        }
      });
      if (changed) localStorage.setItem("bp-pos-state", JSON.stringify(state));
    }
    function normalizeAttendanceRecords() {
      let changed = false;
      state.attendance.forEach(record => {
        if (!record.id) {
          record.id = uid("a");
          changed = true;
        }
      });
      if (changed) localStorage.setItem("bp-pos-state", JSON.stringify(state));
    }
    function normalizeStaffRecords() {
      let changed = false;
      if (!Array.isArray(state.staff)) {
        state.staff = [];
        changed = true;
      }
      const seen = new Set(state.staff.map(staff => String(staff.name || "").trim().toLowerCase()).filter(Boolean));
      const addStaff = (name, role = "Cashier", phone = "", remarks = "") => {
        const cleanName = String(name || "").trim();
        if (!cleanName || seen.has(cleanName.toLowerCase())) return;
        state.staff.push({ id: uid("s"), name: cleanName, role, phone, remarks });
        seen.add(cleanName.toLowerCase());
        changed = true;
      };
      state.users.filter(user => user.role === "Cashier").forEach(user => addStaff(user.username, "Cashier", "", "Cashier login"));
      state.attendance.forEach(record => addStaff(record.name || record.username, record.role || "Cashier", "", "From attendance"));
      state.staff.forEach(staff => {
        if (!staff.id) {
          staff.id = uid("s");
          changed = true;
        }
        staff.name = String(staff.name || "").trim();
        staff.role = staff.role || "Staff";
        staff.phone = staff.phone || "";
        staff.remarks = staff.remarks || "";
      });
      if (changed) localStorage.setItem("bp-pos-state", JSON.stringify(state));
    }
    function can(section) {
      if (currentUser?.role === "Owner") return true;
      if (attendanceRequired() && section === "attendance") return true;
      const user = state.users.find(u => u.username === currentUser?.username);
      return Boolean(user?.permissions?.includes(section));
    }
    function requireOwner() {
      if (currentUser?.role !== "Owner") {
        toast("Owner permission required.");
        return false;
      }
      return true;
    }
    function showSectionMessage(sectionId, text) {
      const section = document.getElementById(sectionId);
      const box = section?.querySelector(".section-message");
      if (box) {
        box.textContent = text;
        box.classList.remove("hidden");
      }
      toast(text);
    }
    function toast(text) {
      lastNotice = text;
    }
    function notifications() {
      const low = state.products.filter(p => Number(p.stock) <= 5).map(p => `Low stock: ${p.name} (${p.stock})`);
      const att = attendanceRequired() ? ["Attendance required before using the POS."] : [];
      const cloud = cloudOnline ? [`Cloud connected: ${API_BASE_URL}`] : ["Cloud offline: using local data."];
      return [...att, ...low, ...cloud].slice(0, 8);
    }

    function init() {
      normalizeSettings();
      normalizeInventoryCategories();
      normalizeUserPermissions();
      normalizeAttendanceRecords();
      normalizeStaffRecords();
      bindLogin();
      bindGlobal();
      if (currentUser) showApp();
      else document.getElementById("username").focus();
      pullCloudState(false).then(loaded => {
        if (!loaded) return;
        normalizeSettings();
        normalizeInventoryCategories();
        normalizeUserPermissions();
        normalizeAttendanceRecords();
        normalizeStaffRecords();
        if (currentUser && activeSection !== "billing") {
          renderNav();
          render(activeSection);
        }
      });
      setInterval(() => {
        document.getElementById("liveClock").textContent = new Date().toLocaleString();
        if (currentUser && activeSection !== "billing") render(activeSection);
      }, 30000);
    }
    function bindLogin() {
      const lockedUntil = Number(localStorage.getItem("bp-pos-lock") || 0);
      if (Date.now() < lockedUntil) showLoginMessage("Account locked for 1 minute after 2 wrong attempts.");
      document.getElementById("passwordToggle").addEventListener("click", () => {
        const passwordInput = document.getElementById("password");
        const showing = passwordInput.type === "text";
        passwordInput.type = showing ? "password" : "text";
        document.getElementById("passwordToggle").textContent = showing ? "Show" : "Hide";
        passwordInput.focus();
      });
      ["username", "password"].forEach((id, index, arr) => {
        document.getElementById(id).addEventListener("keydown", e => {
          if (e.key === "Enter") {
            e.preventDefault();
            if (arr[index + 1]) document.getElementById(arr[index + 1]).focus();
            else document.querySelector("#loginForm button").click();
          }
        });
      });
      document.getElementById("loginForm").addEventListener("submit", e => {
        e.preventDefault();
        const locked = Number(localStorage.getItem("bp-pos-lock") || 0);
        if (Date.now() < locked) return showLoginMessage("Account locked. Try again in " + Math.ceil((locked - Date.now()) / 1000) + " seconds.");
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const user = state.users.find(u => u.username === username && u.password === password && u.active);
        if (!user) {
          const attempts = Number(localStorage.getItem("bp-pos-attempts") || 0) + 1;
          localStorage.setItem("bp-pos-attempts", attempts);
          if (attempts >= 2) {
            localStorage.setItem("bp-pos-lock", Date.now() + 60000);
            localStorage.setItem("bp-pos-attempts", "0");
            return showLoginMessage("Account locked for 1 minute after 2 wrong attempts.");
          }
          return showLoginMessage("Invalid username or password. One attempt remaining.");
        }
        localStorage.setItem("bp-pos-attempts", "0");
        localStorage.removeItem("bp-pos-lock");

    function billTotals(bill) {
      const subtotal = bill.items.reduce((s, i) => s + i.price * i.qty, 0);
      const itemDiscount = bill.items.reduce((s, i) => s + (i.price * i.qty * i.discount / 100), 0);
      const billLevelDiscount = Number(bill.billDiscount || 0);
      const discount = Math.min(subtotal, itemDiscount + billLevelDiscount);
      const total = subtotal - discount;
      return { subtotal, itemDiscount, billLevelDiscount, discount, total, profit: total };
    }
    function billsFor(date) { return state.bills.filter(b => b.date.slice(0, 10) === date); }
    function salesFor(date) { return billsFor(date).reduce((s, b) => s + billTotals(b).total, 0); }
    function expensesFor(date) { return state.expenses.filter(e => e.date === date).reduce((s, e) => s + Number(e.amount), 0); }

              y: { beginAtZero: true, grid: { color: "rgba(13,43,79,0.14)" }, border: { display: false }, ticks: { color: "#6d7788", callback: value => Number(value).toLocaleString("en-PK") } }

    function stat(label, value, hint) {
      return `<div class="card stat"><small>${label}</small><strong>${value}</strong><em>${hint}</em></div>`;
    }
    function renderSalesTooltip(context) {
      const tooltip = context.tooltip;
      const tooltipEl = document.getElementById("salesChartTooltip");
      if (!tooltipEl) return;
      if (!tooltip || tooltip.opacity === 0) {
        tooltipEl.classList.remove("visible");
        return;
      }
      const point = tooltip.dataPoints?.[0];
      if (!point) return;
      tooltipEl.innerHTML = `<strong>${point.label}</strong><span>Sales: ${money(point.parsed.y)}</span>`;
      tooltipEl.style.left = tooltip.caretX + "px";
      tooltipEl.style.top = tooltip.caretY + "px";
      tooltipEl.classList.add("visible");
    }
    function drawFallbackChart(canvas, labels, values) {
      const ctx = canvas.getContext("2d");
      const width = canvas.width = canvas.clientWidth || 680;
      const height = canvas.height = 230;
      const max = Math.max(...values, 1);
      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = "#e6ebf2";
      ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        const y = 24 + i * 45;
        ctx.beginPath(); ctx.moveTo(34, y); ctx.lineTo(width - 12, y); ctx.stroke();
      }
      const slot = (width - 70) / Math.max(values.length, 1);
      labels.forEach((_, i) => {
        const x = 38 + i * slot + slot / 2;
        ctx.beginPath(); ctx.moveTo(x, 18); ctx.lineTo(x, height - 28); ctx.stroke();
      });
      const barWidth = Math.min(78, slot * 0.62);
      values.forEach((v, i) => {
        const x = 38 + i * slot + (slot - barWidth) / 2;
        const barHeight = (v / max) * (height - 70);
        const y = height - 34 - barHeight;
        if (v <= 0) return;
        ctx.fillStyle = "#0d2b4f";
        ctx.beginPath();
        roundedRect(ctx, x, y, barWidth, Math.max(barHeight, 4), 8);
        ctx.fill();
      });
      ctx.fillStyle = "#6d7788";
      ctx.font = "12px Inter, sans-serif";
      labels.forEach((label, i) => ctx.fillText(label, 38 + i * slot + slot / 2 - 16, height - 10));
    }
    function roundedRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height);
      ctx.lineTo(x, y + height);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function saveProduct(e) {
      e.preventDefault();
      const message = document.getElementById("productFormMessage");
      const showProductError = text => {
        message.textContent = text;
        message.classList.remove("hidden");
        toast(text);
      };
      message.classList.add("hidden");
      const file = document.getElementById("imageFile").files[0];
      const finish = image => {
        const old = state.products.find(p => p.id === editingProductId);
        const productName = document.getElementById("name").value.trim();
        const productBarcode = document.getElementById("barcode").value.trim();
        const productCategory = document.getElementById("category").value;
        const productPrice = Number(document.getElementById("price").value);
        const productStock = Number(document.getElementById("stock").value);
        const productDiscount = Number(document.getElementById("discount").value || 0);
        const productRemarks = document.getElementById("remarks").value.trim();
        const product = {
          id: editingProductId || uid("p"),
          name: productName,
          barcode: productBarcode,
          category: productCategory,
          price: productPrice,
          stock: productStock,
          discount: productDiscount,
          remarks: productRemarks,
          image: image || old?.image || ""
        };
        if (!product.name || !product.barcode) return showProductError("Product name and barcode are required.");
        if (!Number.isFinite(product.price) || product.price < 0) return showProductError("Valid product price is required.");
        if (!Number.isFinite(product.stock) || product.stock < 0) return showProductError("Stock quantity cannot be negative.");
        if (state.products.some(p => p.id !== product.id && p.barcode === product.barcode)) return showProductError("This barcode already exists.");
        if (old) {
          state.stockHistory.push({ date: new Date().toLocaleString(), product: product.name, change: product.stock - old.stock, remarks: "Product edit", user: currentUser.username });
          Object.assign(old, product);
        } else {
          state.products.push(product);
          state.stockHistory.push({ date: new Date().toLocaleString(), product: product.name, change: product.stock, remarks: "Initial stock", user: currentUser.username });
        }
        save(); closeModal(); renderInventory();
      };
      if (file) {
        const reader = new FileReader();
        reader.onload = () => finish(reader.result);
        reader.readAsDataURL(file);
      } else finish("");
    }

    function bindBillingEnterFlow() {
      const order = ["customerName", "customerPhone", "scanInput", "saleMode", "paymentMethod", "bankRef", "receivedAmount", "totalDiscount"];

        const el = document.getElementById(id);

    function scanKey(e) {

      const found = state.products.find(p => p.barcode.toLowerCase() === q) || state.products.find(p => p.name.toLowerCase().includes(q));
      if (found) { addToCart(found.id); e.target.value = ""; renderProductResults(); }

    function addToCart(id) {
      if (!customerDetailsReady()) {
        toast("Enter customer name and 11 digit phone number before adding products.");
        document.getElementById("customerName")?.focus();
        return;
      }
      const p = state.products.find(x => x.id === id);
      if (!p || p.stock <= 0) return toast("Product is out of stock.");
      const item = cart.find(i => i.id === id);
      if (item) item.qty = Math.min(item.qty + 1, p.stock);
      else cart.push({ id: p.id, name: p.name, price: p.price, qty: 1, discount: Number(p.discount || 0), stock: p.stock });
      renderCart();
      document.getElementById("scanInput")?.focus();

    function currentCartTotals() {
      billDiscount = Number(document.getElementById("totalDiscount")?.value || billDiscount || 0);
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const itemDiscount = cart.reduce((s, i) => s + i.price * i.qty * i.discount / 100, 0);
      const discount = Math.min(subtotal, itemDiscount + billDiscount);
      return { subtotal, itemDiscount, discount, total: subtotal - discount };
    }

      const paymentMethod = document.getElementById("paymentMethod");

      if (paymentMethod?.value === "Cash" && bankRef) bankRef.value = "";
      updateBillSummary();
    }
    function updateBillSummary() {
      applyBankReferenceAmount();
      const { subtotal, discount, total } = currentCartTotals();
      const received = Number(document.getElementById("receivedAmount")?.value || 0);
      document.getElementById("billSummary").innerHTML = `
        <div><span>Subtotal</span><strong>${money(subtotal)}</strong></div>
        <div><span>Discount</span><strong>${money(discount)}</strong></div>
        <div class="total"><span>Grand Total</span><strong>${money(total)}</strong></div>
        <div><span>Received</span><strong>${money(received)}</strong></div>
        <div><span>Remaining</span><strong>${money(total - received)}</strong></div>`;
    }
    function bindBillingAmountInputs() {
      [["receivedAmount", updateBillSummary], ["totalDiscount", updateBillSummary], ["bankRef", updateBillSummary], ["paymentMethod", paymentMethodChanged]].forEach(([id, handler]) => {
        const el = document.getElementById(id);

    function renderCart() {
      const editable = document.getElementById("saleMode")?.value === "Online Store";

      document.getElementById("cartList").innerHTML = cart.map(i => `<div class="cart-item">
        <div class="cart-row"><div class="cart-title"><strong>${i.name}</strong><small>${money(i.price)} each</small></div><button class="btn light icon" onclick="removeCart('${i.id}')">x</button></div>

          <span class="qty"><button onclick="changeQty('${i.id}',-1)">-</button><strong>${i.qty}</strong><button onclick="changeQty('${i.id}',1)">+</button></span>
          <span>${editable ? `<input class="cart-price-input" type="number" value="${i.price}" onchange="editCartPrice('${i.id}',this.value)">` : money(i.price * i.qty)}</span>
          <div class="cart-discount"><label>Disc %</label><input type="number" min="0" max="100" value="${i.discount}" onchange="editCartDiscount('${i.id}',this.value)" oninput="editCartDiscount('${i.id}',this.value)"></div>

    function saleModeChanged() {

    function changeQty(id, step) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty = Math.max(1, Math.min(item.stock, item.qty + step));
      renderCart();
    }
    function editCartPrice(id, value) {
      const item = cart.find(i => i.id === id);
      if (item) item.price = Number(value);
      renderCart();
    }
    function editCartDiscount(id, value) {
      const item = cart.find(i => i.id === id);
      if (item) item.discount = Math.max(0, Math.min(100, Number(value || 0)));
      renderCart();
    }
    function removeCart(id) { cart = cart.filter(i => i.id !== id); renderCart(); }
    function clearCart() { cart = []; billDiscount = 0; const totalInput = document.getElementById("totalDiscount"); if (totalInput) totalInput.value = 0; renderCart(); }
    function saveBill(print = false) {
      if (currentUser.role === "Cashier" && !hasWorkAttendanceToday(currentUser.username)) return toast("Mark attendance before billing.");
      const customerName = document.getElementById("customerName").value.trim();
      const customerPhone = document.getElementById("customerPhone").value.trim();
      if (!customerName || !/^\d{11}$/.test(customerPhone)) return toast("Customer name and 11 digit phone number are required.");
      if (!cart.length) return toast("Add at least one item.");
      const bill = {
        id: uid("b"), date: new Date().toISOString(), cashier: currentUser.username, customerName, customerPhone,
        saleMode: document.getElementById("saleMode").value, paymentMethod: document.getElementById("paymentMethod").value,
        bankRef: document.getElementById("bankRef").value, received: Number(document.getElementById("receivedAmount").value || 0),
        billDiscount: Number(document.getElementById("totalDiscount").value || 0),
        items: cart.map(i => ({ ...i }))
      };
      bill.items.forEach(item => {
        const p = state.products.find(x => x.id === item.id);
        if (p) {
          p.stock -= item.qty;
          state.stockHistory.push({ date: new Date().toLocaleString(), product: p.name, change: -item.qty, remarks: "Bill " + bill.id, user: currentUser.username });
        }
      });
      state.bills.push(bill);
      save();
      cart = [];
      billDiscount = 0;
      if (print || state.settings.autoPrint) printReceipt(bill);
      renderBilling();
      toast("Bill saved successfully.");

    function printThermalReceipt(receiptMarkup) {
      printReceiptFromCurrentPage(receiptMarkup);
    }
    function printReceiptFromCurrentPage(receiptMarkup) {
      const printArea = document.getElementById("printArea");
      printArea.innerHTML = receiptMarkup;
      printArea.classList.remove("hidden");
      const images = Array.from(printArea.querySelectorAll("img"));
      const imageReady = images.map(img => img.complete ? Promise.resolve() : new Promise(resolve => {
        img.onload = resolve;
        img.onerror = resolve;
      }));
      const finishPrint = () => {
        printArea.classList.add("hidden");
        printArea.innerHTML = "";
        window.removeEventListener("afterprint", finishPrint);
      };
      window.addEventListener("afterprint", finishPrint);
      Promise.all(imageReady).then(() => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => {
        window.print();
        setTimeout(finishPrint, 15000);
      }, 300))));
    }

    function renderReports() {
      const daily = salesFor(todayKey());

      </tbody></table></div>`;

    function printReceiptById(id) { const b = state.bills.find(x => x.id === id); if (b) printReceipt(b); }
    function deleteBill(id) {
      if (!requireOwner() || !confirm("Delete bill? Stock will not be restored automatically.")) return;
      state.bills = state.bills.filter(b => b.id !== id);
      save(); renderReports();
    }

    function hasAttendanceToday(username) {
      return state.attendance.some(a => a.username === username && a.date === todayKey());
    }
    function hasWorkAttendanceToday(username) {
      return state.attendance.some(a => a.username === username && a.date === todayKey() && a.status !== "Absent");
    }
    function todayAttendance(username) {
      return state.attendance.slice().reverse().find(a => a.username === username && a.date === todayKey());
    }
    function openAttendanceToday(username) {
      return state.attendance.slice().reverse().find(a => a.username === username && a.date === todayKey() && !a.outTime);
    }
    function isTodayClosed() {
      return state.dayClosings.some(d => d.date === todayKey() && d.status === "Closed");
    }
    function attendanceRequired() {
      return currentUser?.role === "Cashier" && !isTodayClosed() && !hasWorkAttendanceToday(currentUser.username);
    }
    function markOutRequired() {
      const record = currentUser?.role === "Cashier" ? openAttendanceToday(currentUser.username) : null;
      return Boolean(record && !record.outTime);
    }
    function attendanceStaffOptions() {
      const staff = [];
      const seen = new Set();
      const addStaff = (name, username = name, role = "Cashier") => {
        const cleanName = String(name || "").trim();
        if (!cleanName || seen.has(cleanName.toLowerCase())) return;
        seen.add(cleanName.toLowerCase());
        staff.push({ name: cleanName, username: String(username || cleanName).trim(), role });
      };
      (state.staff || []).forEach(staffMember => addStaff(staffMember.name, staffMember.name, staffMember.role || "Staff"));
      state.attendance.forEach(record => addStaff(record.name || record.username, record.staffUsername || record.username, record.role || "Cashier"));
      if (!staff.length && currentUser?.role === "Cashier") addStaff(currentUser.username, currentUser.username, currentUser.role);
      return staff.sort((a, b) => a.name.localeCompare(b.name));
    }
    function selectedAttendanceStaff() {
      const select = document.getElementById("attendancePersonSelect");
      const option = select?.options[select.selectedIndex];
      if (!select?.value) return null;
      return {
        name: select.value,
        username: option?.dataset.username || select.value,
        role: option?.dataset.role || "Cashier"
      };
    }
    function renderAttendance() {
      const selectedMonth = document.getElementById("attendanceMonth")?.value || sessionStorage.getItem("bp-pos-attendance-month") || monthKey();
      sessionStorage.setItem("bp-pos-attendance-month", selectedMonth);
      const report = buildMonthlyAttendanceReport(selectedMonth);
      const attendanceRows = report.rows.filter(record => !record.virtual);
      const needsMark = attendanceRequired();
      const needsOut = markOutRequired();
      const cashierName = currentUser?.username || "User";
      const currentRecord = todayAttendance(cashierName);
      const canManage = currentUser?.role === "Owner";
      const staffOptions = attendanceStaffOptions();
      const selectedStaff = sessionStorage.getItem("bp-pos-selected-staff") || currentRecord?.name || staffOptions[0]?.name || "";
      document.getElementById("attendance").innerHTML = `<div class="card">
        <div class="section-title"><h3>Attendance</h3><span class="badge ${needsOut ? "warn" : "good"}">${needsOut ? "Open Attendance" : "Ready"}</span></div>
        <div class="attendance-user-card">
          <small>${needsMark ? "Mark attendance first" : "Mark another attendance"}</small>
          <strong>${cashierName}</strong>
          <span>${currentRecord ? `Last in: ${currentRecord.name || currentRecord.username} at ${currentRecord.time || "Absent"}${currentRecord.outTime ? ` - out ${currentRecord.outTime}` : ""}` : "Select staff person and mark attendance"}</span>
          <div class="form-grid" style="margin-top:10px">
            <div class="field wide"><label>Staff Person</label><select id="attendancePersonSelect" onchange="sessionStorage.setItem('bp-pos-selected-staff', this.value)" onkeydown="attendanceNameKey(event)">
              ${staffOptions.map(staff => `<option value="${staff.name}" data-username="${staff.username}" data-role="${staff.role}" ${staff.name === selectedStaff ? "selected" : ""}>${staff.name}</option>`).join("")}
            </select></div>
            <div class="field"><label>&nbsp;</label><button class="btn orange" onclick="markAttendance()">Mark Present</button></div>
            <div class="field"><label>&nbsp;</label><button class="btn danger" onclick="markAbsent()">Mark Absent</button></div>
            <div class="field"><label>&nbsp;</label><button class="btn light" onclick="markOutAttendance()" ${needsOut ? "" : "disabled"}>Mark Out</button></div>
          </div>
        </div>
        ${needsMark ? `<div class="alert">Please select the staff person and click Mark Present first. Billing and other POS sections will unlock after attendance is marked.</div>` : `<p class="muted">Attendance stays ready so another staff person can be marked whenever this tab is opened.</p>`}
        <div class="attendance-month-bar">
          <div class="field"><label>Monthly Report</label><input id="attendanceMonth" type="month" value="${selectedMonth}" onchange="renderAttendance()"></div>
          <button class="btn light" onclick="exportCSV('attendance')">Export Monthly Attendance</button>
        </div>
        <div class="attendance-report-head">
          ${attendanceReportCard("Present", report.summary.present)}
          ${attendanceReportCard("Absent", report.summary.absent)}
          ${attendanceReportCard("Completed", report.summary.completed)}
          ${attendanceReportCard("No Record", report.summary.none)}
        </div>
        <div class="table-wrap attendance-table"><table><thead><tr><th>Date</th><th>Name</th><th>Role</th><th>In Time</th><th>Out Time</th><th>Status</th>${canManage ? "<th>Actions</th>" : ""}</tr></thead><tbody>
        ${attendanceRows.map(a => attendanceRow(a, canManage)).join("") || `<tr><td colspan="${canManage ? 7 : 6}">No marked attendance records for this month.</td></tr>`}
        </tbody></table></div>
      </div>`;
      setTimeout(() => document.getElementById("attendancePersonSelect")?.focus(), 50);
    }
    function attendanceReportCard(label, value) {
      return `<div class="attendance-report-card"><small>${label}</small><strong>${value}</strong></div>`;
    }
    function buildMonthlyAttendanceReport(selectedMonth = monthKey()) {
      const [year, month] = selectedMonth.split("-").map(Number);
      const days = new Date(year, month, 0).getDate();
      const today = todayKey();
      const cashiers = attendanceStaffOptions().map(staff => staff.name);
      state.attendance.forEach(record => {
        const staffName = record.name || record.username;
        if (record.date?.slice(0, 7) === selectedMonth && staffName && !cashiers.includes(staffName)) cashiers.push(staffName);
      });
      const rows = [];
      const summary = { present: 0, absent: 0, completed: 0, none: 0 };
      for (let day = 1; day <= days; day++) {
        const date = `${selectedMonth}-${String(day).padStart(2, "0")}`;
        if (date > today) continue;
        cashiers.forEach(username => {
          const records = state.attendance.filter(record => (record.name || record.username) === username && record.date === date);
          if (!records.length) {
            rows.push({ id: "", date, username, name: username, role: "Cashier", time: "-", outTime: "-", status: "No Record", virtual: true });
            summary.none++;
            return;
          }
          records.forEach(record => {
            rows.push(record);
            if (record.status === "Absent") summary.absent++;
            else if (record.outTime || record.status === "Completed") summary.completed++;
            else summary.present++;
          });
        });
      }
      return { rows: rows.reverse(), summary };
    }
    function attendanceRow(record, canManage) {
      const status = record.status === "No Record" ? "No Record" : record.outTime ? "Completed" : record.status;
      const badgeClass = status === "Completed" || status === "Present" ? "good" : "warn";
      return `<tr>
        <td>${record.date}</td>
        <td><strong>${record.name || record.username}</strong></td>
        <td>${record.role}</td>
        <td>${record.time || "-"}</td>
        <td>${record.outTime || "-"}</td>
        <td><span class="badge ${badgeClass}">${status}</span></td>
        ${canManage ? `<td>${record.virtual ? `<span class="muted">No action</span>` : `<button class="btn light" onclick="openAttendanceModal('${record.id}')">Edit</button> <button class="btn danger" onclick="deleteAttendance('${record.id}')">Delete</button>`}</td>` : ""}
      </tr>`;
    }
    function markAttendance() {
      const staff = selectedAttendanceStaff();
      if (!staff) {
        toast("Select staff person first.");
        document.getElementById("attendancePersonSelect")?.focus();
        return;
      }
      sessionStorage.setItem("bp-pos-selected-staff", staff.name);
      state.attendance.push({ id: uid("a"), date: todayKey(), username: currentUser.username, staffUsername: staff.username, name: staff.name, role: staff.role, time: new Date().toLocaleTimeString(), status: "Present", markedBy: currentUser.username });
      save();
      renderNav();
      renderAttendance();
      toast(`${staff.name} marked present.`);
    }
    function markAbsent() {
      const staff = selectedAttendanceStaff();
      if (!staff) {
        toast("Select staff person first.");
        document.getElementById("attendancePersonSelect")?.focus();
        return;
      }
      sessionStorage.setItem("bp-pos-selected-staff", staff.name);
      state.attendance.push({ id: uid("a"), date: todayKey(), username: currentUser.username, staffUsername: staff.username, name: staff.name, role: staff.role, time: "", outTime: "", status: "Absent", markedBy: currentUser.username });
      save();
      renderNav();
      renderAttendance();
      toast(`${staff.name} marked absent.`);
    }
    function attendanceNameKey(event) {
      if (event.key !== "Enter") return;
      event.preventDefault();
      markAttendance();
    }
    function openAttendanceModal(id) {
      if (!requireOwner()) return;
      const record = state.attendance.find(a => a.id === id);
      if (!record) return toast("Attendance record not found.");
      const cashierUsers = state.users.filter(user => user.role === "Cashier");
      if (!cashierUsers.some(user => user.username === record.username)) {
        cashierUsers.push({ username: record.username, role: record.role || "Cashier" });
      }
      document.getElementById("modalRoot").innerHTML = `<div class="modal"><div class="modal-panel small-modal">
        <div class="section-title"><h3>Edit Attendance</h3><button class="btn light icon" onclick="closeModal()">x</button></div>
        <form id="attendanceEditForm" class="form-grid">
          <div class="field wide"><label>Cashier</label><select id="attendanceUser">${cashierUsers.map(user => `<option value="${user.username}" ${record.username === user.username ? "selected" : ""}>${user.username}</option>`).join("")}</select></div>
          ${field("Person Name", "attendancePerson", record.name || record.username)}
          ${field("Date", "attendanceDate", record.date, "date")}
          ${field("In Time", "attendanceIn", record.time || "", "text")}
          ${field("Out Time", "attendanceOut", record.outTime || "", "text")}
          <div class="field"><label>Status</label><select id="attendanceStatus">${["Present", "Completed", "Absent", "Late"].map(status => `<option ${record.status === status ? "selected" : ""}>${status}</option>`).join("")}</select></div>
          <div id="attendanceFormMessage" class="alert hidden wide"></div>
          <div class="field wide"><button class="btn orange" type="submit">Save Attendance</button></div>
        </form>
      </div></div>`;
      document.getElementById("attendanceEditForm").onsubmit = event => saveAttendanceEdit(event, id);
    }
    function saveAttendanceEdit(event, id) {
      event.preventDefault();
      if (!requireOwner()) return;
      const record = state.attendance.find(a => a.id === id);
      if (!record) return toast("Attendance record not found.");
      const message = document.getElementById("attendanceFormMessage");
      const username = document.getElementById("attendanceUser").value.trim();
      const personName = document.getElementById("attendancePerson").value.trim();
      const date = document.getElementById("attendanceDate").value;
      const inTime = document.getElementById("attendanceIn").value.trim();
      const outTime = document.getElementById("attendanceOut").value.trim();
      const status = document.getElementById("attendanceStatus").value;
      if (!username || !personName || !date || (status !== "Absent" && !inTime)) {
        message.textContent = "Cashier, person name, date, and in time are required unless status is Absent.";
        message.classList.remove("hidden");
        return;
      }
      const cashier = state.users.find(user => user.username === username);
      record.username = username;
      record.name = personName;
      record.role = cashier?.role || "Cashier";
      record.date = date;
      record.time = inTime;
      record.outTime = outTime;
      record.status = status === "Absent" ? "Absent" : outTime ? "Completed" : status;
      if (outTime && !record.outAt) record.outAt = new Date().toISOString();
      if (!outTime) delete record.outAt;
      save();
      closeModal();
      renderAttendance();
      toast("Attendance updated.");
    }
    function deleteAttendance(id) {
      if (!requireOwner()) return;
      if (!confirm("Delete this attendance record?")) return;
      state.attendance = state.attendance.filter(record => record.id !== id);
      save();
      renderAttendance();
      toast("Attendance deleted.");
    }
    function markOutAttendance(skipToast = false) {
      const record = openAttendanceToday(currentUser?.username);
      if (!record) {
        if (!skipToast) toast("Mark attendance first.");
        return false;
      }
      if (record.outTime) {
        if (!skipToast) toast("Out attendance already marked.");
        return false;
      }
      record.outTime = new Date().toLocaleTimeString();
      record.outAt = new Date().toISOString();

    function exportCSV(type) {
      let rows = [];
      if (type === "inventory") rows = [["Name","Barcode","Category","Price","Stock","Discount","Remarks"], ...state.products.map(p => [p.name,p.barcode,p.category,p.price,p.stock,p.discount,p.remarks])];
      if (type === "bills") rows = [["Date","Bill","Customer","Phone","Cashier","Sale Mode","Payment","Bank","Discount","Total"], ...state.bills.map(b => [b.date,b.id,b.customerName,b.customerPhone,b.cashier,b.saleMode || "In Store",b.paymentMethod,b.bankRef,billTotals(b).discount,billTotals(b).total])];
      if (type === "attendance") {
        const selectedMonth = document.getElementById("attendanceMonth")?.value || sessionStorage.getItem("bp-pos-attendance-month") || monthKey();
        const report = buildMonthlyAttendanceReport(selectedMonth);
        rows = [["Date","Name","Role","In Time","Out Time","Status"], ...report.rows.filter(a => !a.virtual).slice().reverse().map(a => [a.date,a.name || a.username,a.role,a.time || "",a.outTime || "",a.status])];
      }
      const csv = rows.map(r => r.map(v => `"${String(v ?? "").replaceAll('"','""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `brands-planets-${type}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    }
