<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="theme-color" content="#0d2b4f">
  <title>Brands Planets POS</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var theme = localStorage.getItem("bp-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        if (localStorage.getItem("bp-effects") === "lite") document.documentElement.classList.add("lite");
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" href="assets/logo-64.png">
  <link rel="apple-touch-icon" href="assets/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pos.css?v=2.0.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <div id="loginPage" class="login-shell hidden">
    <div class="login-scene" id="loginScene" aria-hidden="true">
      <div class="login-ring"></div>
      <div class="login-ring r2"></div>
      <div class="login-orb o1"></div>
      <div class="login-orb o2"></div>
      <div class="login-orb o3"></div>
    </div>
    <form class="login-card" id="loginForm" autocomplete="on" novalidate>
      <div class="login-brand">
        <div class="login-logo"><img src="assets/logo-192.png" alt="Brands Planets"></div>
        <h1>Brands Planets POS</h1>
        <p>Sign in to start selling</p>
      </div>
      <div class="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Enter username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
            <button class="icon-btn sm" id="passwordToggle" type="button" aria-label="Show password"></button>
          </div>
        </div>
        <div class="login-row">
          <label class="check"><input type="checkbox" id="rememberMe"> Remember me</label>
          <span id="capsHint" class="hidden">Caps Lock is on</span>
        </div>
        <div id="loginMessage" class="login-error hidden" role="alert"></div>
        <button class="btn btn-accent btn-block login-submit" id="loginSubmit" type="submit">Sign in</button>
      </div>
      <div class="login-foot">Secure sign-in &middot; Brands Planets Retail</div>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar" aria-label="Main navigation"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div id="banner"></div>
      <main id="content" class="content">
        <div id="view" class="view"></div>
      </main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="printArea"></div>

  <script src="lib/permissions.js?v=2.0.0"></script>
  <script src="lib/promotions.js?v=2.0.0"></script>
  <script src="lib/stock.js?v=2.0.0"></script>
  <script src="js/util.js?v=2.0.0"></script>
  <script src="js/ui.js?v=2.0.0"></script>
  <script src="js/store.js?v=2.0.0"></script>
  <script src="js/domain.js?v=2.0.0"></script>
  <script src="js/receipt.js?v=2.0.0"></script>
  <script src="js/views/dashboard.js?v=2.0.0"></script>
  <script src="js/views/pos.js?v=2.0.0"></script>
  <script src="js/views/sales.js?v=2.0.0"></script>
  <script src="js/views/products.js?v=2.0.0"></script>
  <script src="js/views/inventory.js?v=2.0.0"></script>
  <script src="js/views/customers.js?v=2.0.0"></script>
  <script src="js/views/returns.js?v=2.0.0"></script>
  <script src="js/views/promotions.js?v=2.0.0"></script>
  <script src="js/views/expenses.js?v=2.0.0"></script>
  <script src="js/views/reports.js?v=2.0.0"></script>
  <script src="js/views/staff.js?v=2.0.0"></script>
  <script src="js/views/attendance.js?v=2.0.0"></script>
  <script src="js/views/settings.js?v=2.0.0"></script>
  <script src="js/shell.js?v=2.0.0"></script>
</body>
</html>
